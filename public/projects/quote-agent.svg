<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradQ1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="300" height="200" fill="#0a0a15"/>

  <!-- Agent node -->
  <circle cx="60" cy="100" r="22" fill="none" stroke="url(#gradQ1)" stroke-width="2"/>
  <text x="60" y="106" text-anchor="middle" fill="url(#gradQ1)" font-size="16" font-weight="bold">AI</text>

  <!-- Flow lines to carriers -->
  <line x1="82" y1="100" x2="140" y2="60" stroke="url(#gradQ1)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="82" y1="100" x2="140" y2="100" stroke="url(#gradQ1)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="82" y1="100" x2="140" y2="140" stroke="url(#gradQ1)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Carrier boxes -->
  <rect x="140" y="48" width="48" height="24" rx="4" fill="none" stroke="url(#gradQ1)" stroke-width="1.5"/>
  <rect x="140" y="88" width="48" height="24" rx="4" fill="none" stroke="url(#gradQ1)" stroke-width="1.5"/>
  <rect x="140" y="128" width="48" height="24" rx="4" fill="none" stroke="url(#gradQ1)" stroke-width="1.5"/>

  <!-- Comparison arrow -->
  <line x1="188" y1="100" x2="220" y2="100" stroke="url(#gradQ1)" stroke-width="2"/>
  <polygon points="220,95 230,100 220,105" fill="url(#gradQ1)"/>

  <!-- Approval check -->
  <circle cx="255" cy="100" r="18" fill="none" stroke="#22c55e" stroke-width="2"/>
  <path d="M 247 100 L 253 107 L 264 92" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="150" y="175" text-anchor="middle" fill="url(#gradQ1)" font-size="12" font-weight="bold">Cotización → Comparativo → Aprobación</text>
</svg>
