      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="300" height="200" fill="#0a0a15"/>

  <!-- Chat bubble -->
  <path d="M 45 55 h 70 a 10 10 0 0 1 10 10 v 35 a 10 10 0 0 1 -10 10 h -45 l -15 15 v -15 h -10 a 10 10 0 0 1 -10 -10 v -35 a 10 10 0 0 1 10 -10 z"
        fill="none" stroke="url(#gradW1)" stroke-width="2"/>
  <circle cx="65" cy="82" r="3" fill="url(#gradW1)"/>
  <circle cx="80" cy="82" r="3" fill="url(#gradW1)"/>
  <circle cx="95" cy="82" r="3" fill="url(#gradW1)"/>

  <!-- Link nodes with status -->
  <g font-size="9" fill="url(#gradW1)">
    <circle cx="170" cy="55" r="5" fill="#22c55e"/>
    <line x1="178" y1="55" x2="230" y2="55" stroke="#2d2d44" stroke-width="2"/>
    <circle cx="170" cy="85" r="5" fill="#22c55e"/>
    <line x1="178" y1="85" x2="230" y2="85" stroke="#2d2d44" stroke-width="2"/>
    <circle cx="170" cy="115" r="5" fill="#ef4444"/>
    <line x1="178" y1="115" x2="230" y2="115" stroke="#2d2d44" stroke-width="2"/>
    <circle cx="170" cy="145" r="5" fill="#22c55e"/>
    <line x1="178" y1="145" x2="230" y2="145" stroke="#2d2d44" stroke-width="2"/>
  </g>

  <!-- Alert -->
  <path d="M 250 100 L 262 122 h -24 z" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round"/>
  <line x1="250" y1="107" x2="250" y2="114" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="250" cy="118" r="1.2" fill="#ef4444"/>

  <text x="150" y="175" text-anchor="middle" fill="url(#gradW1)" font-size="12" font-weight="bold">Monitoreo de Enlaces + Edición Masiva</text>
</svg>
